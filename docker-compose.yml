name: atlas-cmms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server --address ":9000" --console-address ":9001" /data

  api:
    # Backend recompilé avec le correctif ESAAT (voir atlas-api/)
    build: ./atlas-api
    image: esaat/atlas-cmms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./logo:/app/static/images
      - ./config:/app/static/config
    environment:
      DB_URL: postgres/atlas
      DB_USER: ${POSTGRES_USER}
      DB_PWD: ${POSTGRES_PWD}
      PUBLIC_API_URL: ${PUBLIC_SERVER_URL}/api
      PUBLIC_FRONT_URL: ${PUBLIC_SERVER_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Stockage
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: atlas-bucket
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      PUBLIC_MINIO_ENDPOINT: ${PUBLIC_SERVER_URL}/storage
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME:-}
      GCP_JSON: ${GCP_JSON:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # Mail (désactivé pour le test)
      INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
      MAIL_TYPE: ${MAIL_TYPE:-smtp}
      MAIL_RECIPIENTS: ${MAIL_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PWD: ${SMTP_PWD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_CONTACT_LIST_ID: ${SENDGRID_CONTACT_LIST_ID:-}
      # SSO / LDAP (désactivés)
      ENABLE_SSO: ${ENABLE_SSO:-false}
      OAUTH2_PROVIDER: ${OAUTH2_PROVIDER:-}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_ORG_ADMIN: ${LDAP_ORG_ADMIN:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_MANAGER_DN: ${LDAP_MANAGER_DN:-}
      LDAP_MANAGER_PASSWORD: ${LDAP_MANAGER_PASSWORD:-}
      LDAP_USER_SEARCH_BASES: ${LDAP_USER_SEARCH_BASES:-}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-}
      LDAP_ATTR_EMAIL: ${LDAP_ATTR_EMAIL:-}
      LDAP_ATTR_FIRSTNAME: ${LDAP_ATTR_FIRSTNAME:-}
      LDAP_ATTR_LASTNAME: ${LDAP_ATTR_LASTNAME:-}
      LDAP_ATTR_USERNAME: ${LDAP_ATTR_USERNAME:-}
      LDAP_OBJECT_CLASS: ${LDAP_OBJECT_CLASS:-}
      LDAP_OU_ROLE_MAPPINGS: ${LDAP_OU_ROLE_MAPPINGS:-}
      LDAP_SYNC_ENABLED: ${LDAP_SYNC_ENABLED:-false}
      LDAP_SYNC_CREATE: ${LDAP_SYNC_CREATE:-false}
      LDAP_SYNC_UPDATE: ${LDAP_SYNC_UPDATE:-false}
      LDAP_SYNC_DISABLE: ${LDAP_SYNC_DISABLE:-false}
      LDAP_SYNC_CRON: ${LDAP_SYNC_CRON:-}
      # Divers
      LICENSE_KEY: ${LICENSE_KEY:-}
      LOCAL_ENTITLEMENTS: ${LOCAL_ENTITLEMENTS:-}
      LICENSE_FINGERPRINT_REQUIRED: ${LICENSE_FINGERPRINT_REQUIRED:-false}
      LICENSE_FILE_PATH: ${LICENSE_FILE_PATH:-}
      KEYGEN_PRODUCT_TOKEN: ${KEYGEN_PRODUCT_TOKEN:-}
      ALLOWED_ORGANIZATION_ADMINS: ${ALLOWED_ORGANIZATION_ADMINS:-}
      LOGO_PATHS: ${LOGO_PATHS:-}
      CUSTOM_COLORS: ${CUSTOM_COLORS:-}
      BRAND_CONFIG: ${BRAND_CONFIG:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET_KEY: ${PADDLE_WEBHOOK_SECRET_KEY:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      ENABLE_CORS: ${ENABLE_CORS:-false}
      SINGLE_INGRESS: "true"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}

  frontend:
    image: intelloop/atlas-cmms-frontend:v1.9.0
    restart: unless-stopped
    depends_on:
      - api
    # Logo et icônes ESAAT à la place de ceux d'Atlas (voir branding/)
    volumes:
      - ./branding/logo.png:/usr/share/nginx/html/static/images/logo/logo.png:ro
      - ./branding/logo-white.png:/usr/share/nginx/html/static/images/logo/logo-white.png:ro
      - ./branding/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
      - ./branding/favicon-16x16.png:/usr/share/nginx/html/favicon-16x16.png:ro
      - ./branding/favicon-32x32.png:/usr/share/nginx/html/favicon-32x32.png:ro
      - ./branding/apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./branding/manifest.json:/usr/share/nginx/html/manifest.json:ro
    # Le frontend refuse les variables vides : d'où les ":- " (espace) par défaut
    environment:
      API_URL: /api
      NODE_ENV: production
      HOME_URL: ${HOME_URL:-https://atlas-cmms.com}
      CLOUD_VERSION: ${CLOUD_VERSION:-false}
      INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
      ENABLE_SSO: ${ENABLE_SSO:-false}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      OAUTH2_PROVIDER: ${OAUTH2_PROVIDER:- }
      GOOGLE_KEY: ${GOOGLE_KEY:- }
      GOOGLE_TRACKING_ID: ${GOOGLE_TRACKING_ID:- }
      # Une valeur non vide masque « Powered by Intelloop » (isWhiteLabeled côté frontend).
      # Sans licence, Atlas garde son logo par défaut, déjà remplacé par celui de l'ESAAT (branding/).
      LOGO_PATHS: '{"dark":"/static/images/logo/logo.png","white":"/static/images/logo/logo-white.png"}'
      CUSTOM_COLORS: ${CUSTOM_COLORS:- }
      BRAND_CONFIG: ${BRAND_CONFIG:- }
      DEMO_LINK: ${DEMO_LINK:- }
      PADDLE_SECRET_TOKEN: ${PADDLE_SECRET_TOKEN:- }
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:- }
      SENTRY_DSN: ${SENTRY_DSN:- }
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:- }
      SENTRY_RELEASE: ${SENTRY_RELEASE:- }
      CLARITY_ID: ${CLARITY_ID:- }

  demande:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /app
    command: node server.js
    volumes:
      - ./demande:/app:ro
    environment:
      ATLAS_API_URL: http://api:8080
      DEMANDE_EMAIL: ${DEMANDE_EMAIL}
      DEMANDE_PASSWORD: ${DEMANDE_PASSWORD}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
      - minio
      - demande
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-3000}:80"

volumes:
  postgres_data:
  minio_data:
