# Point d'entrée unique : / -> frontend, /api/ -> backend, /storage/ -> MinIO
upstream atlas_frontend { server frontend:3000; }
upstream atlas_backend  { server api:8080; }
upstream atlas_minio    { server minio:9000; }
upstream atlas_demande  { server demande:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://atlas_frontend;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_pass http://atlas_backend/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Formulaire public de demande de travaux
    location /demande {
        proxy_set_header Host $host;
        proxy_pass http://atlas_demande;
        client_max_body_size 1M;
    }

    location /storage/ {
        proxy_set_header Host minio:9000;
        proxy_pass http://atlas_minio/;
        proxy_buffering off;
        client_max_body_size 500M;
    }
}
